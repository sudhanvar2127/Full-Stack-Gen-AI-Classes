<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }


        .div{
            background-color: blue;
            color: white;
            padding: 20px;
            margin: 5px;
            width: 100px;
            height: 100px;
        }

        .div1{
            background-color: red;
            color: white;
            display: inline;
            margin: 10px;
        }

        .span{
            background-color: bisque;
            display: block;
            margin: 10px;
        }

        .achor{
            background-color: yellow;
        }

        p{
            background-color: blanchedalmond;
            display: inline-block;
            width: 100px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="div">I'm a Block Element</div>
    <div class="div1">I'm a another Block Element</div>
    <span class="span">I'm an inline Element</span>
    <a href="" class="achor">Click Me</a>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Reiciendis, nihil.</p>
</body>
</html>
